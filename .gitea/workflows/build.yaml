  build:
    name: Build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    #needs: tests  # Executa somente após os testes

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            dockerfile: build/Dockerfile-auth
            ecr_repo: auth-service

          - service: flag
            dockerfile: build/Dockerfile-flag
            ecr_repo: flag-service

          - service: targeting
            dockerfile: build/Dockerfile-targeting
            ecr_repo: targeting-service

          - service: evaluation
            dockerfile: build/Dockerfile-evaluation
            ecr_repo: evaluation-service

          - service: analytics
            dockerfile: build/Dockerfile-analytics
            ecr_repo: analytics-service

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. Docker Build
      - name: Setup do Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build do microserviço
        uses: docker/build-push-action@v7
        with:
          context: ./build
          file: ./${{ matrix.dockerfile }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          tags: ${{ matrix.service }}-service:${{ github.sha }}
          push: false

      # 3. Container image scan
      - name: Cache Trivy DB
        uses: actions/cache@v5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      - name: Setup Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | \
          sh -s -- -b /usr/local/bin v${{ env.TRIVY_VERSION }}

      # Usa o Trivy diretamente pois não precisa de autenticação no Github
      - name: SCA - Trivy
        run: |
          trivy image \
          --cache-dir ~/.cache/trivy \
          --skip-version-check \
          --disable-telemetry \
          --format table \
          --exit-code 1 \
          --severity CRITICAL \
          --ignore-unfixed \
          --pkg-types library \
          --scanners vuln \
          "${{ matrix.service }}-service:${{ github.sha }}"

      - name: Inclui tag curta
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # # OIDC somente para o GitHub. Praticamente indisponível para instâncias self-hosted
      # - name: Configurar credenciais AWS (OIDC)
      #   id: login-ecr
      #   uses: aws-actions/configure-aws-credentials@v6
      #   with:
      #     role-to-assume: arn:aws:iam::${{ secrets.AWS_ACC_ID }}:role/${{ secrets.AWS_GIT_ROLE }}
      #     aws-region: ${{ secrets.AWS_REGION }}
      #     mask-aws-account-id: true

      # Acesso com Access Key para instâncias self-hosted isoladas
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login no AWS ECR
      - name: Login no AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'false'

      # # 4. Push para o AWS ECR
      # - name: Push do microserviço ao ECR
      #   env:
      #     REGISTRY: ${{ secrets.AWS_ACC_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      #   run: |
      #     SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
      #     docker tag ${{ matrix.service }}-service:${{ github.sha }} ${{ env.REGISTRY }}/toggle/${{ matrix.ecr_repo }}:v${{ env.TAG_VERSION }}-${SHORT_SHA}
      #     docker push ${{ env.REGISTRY }}/toggle/${{ matrix.ecr_repo }}:v${{ env.TAG_VERSION }}-${SHORT_SHA}
      #     if [ "${{ github.ref }}" = "refs/heads/main" ]; then
      #       docker tag ${{ matrix.service }}-service:${{ github.sha }} ${{ env.REGISTRY }}/toggle/${{ matrix.ecr_repo }}:latest
      #       docker push ${{ env.REGISTRY }}/toggle/${{ matrix.ecr_repo }}:latest
      #     fi

      # 4. Push para o AWS ECR
      - name: Push do microserviço ao ECR
        uses: docker/build-push-action@v7
        env:
          REGISTRY: ${{ secrets.AWS_ACC_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
        with:
          context: ./build
          file: ./${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha
          tags: |
            ${{ env.REGISTRY }}/toggle/${{ matrix.ecr_repo }}:latest
            ${{ env.REGISTRY }}/toggle/${{ matrix.ecr_repo }}:v${{ env.TAG_VERSION }}-${{ env.SHORT_SHA }}

      # - name: Push Docker image to ECR
      #   run: |
      #     ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
      #     IMAGE_NAME=${ECR_REGISTRY}/${{ matrix.ecr_repo }}
          
