      # SCA - Trivy filesystem (bloqueia vulnerabilidade crítica)
      # Fixa as versões do requirements para o Trivy
      - name: Prepara o requirements para o Trivy (Python)
        if: matrix.language == 'python'
        working-directory: ${{ matrix.code_dir }}
        run: |
          cp -v requirements.txt requirements.txt.bkp
          pip -v freeze > requirements.txt

      # Usa a imagem Docker diretamente para evitar falha de autenticação na action do Trivy
      - name: SCA - Trivy
        run: |
          # Usa "--volumes-from" para herdar o workdir do runner
          docker run --rm --volumes-from $(hostname) docker.io/aquasec/trivy:${{ env.TRIVY_VERSION }} \
          fs \
          --format table \
          --exit-code 1 \
          --severity CRITICAL \
          --ignore-unfixed \
          --pkg-types library \
          --scanners vuln,config \
          ${{ github.workspace }}/${{ matrix.code_dir }}

