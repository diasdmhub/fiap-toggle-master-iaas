name: ToggleMaster Microservices - CI Pipeline

on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:

# Permissões para OIDC
permissions:
  id-token: write
  contents: read

jobs:
  ci:
    name: CI - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            language: go
            dockerfile: build/Dockerfile-auth
            code_dir: build/auth-service
            docker_context: build
            ecr_repo: auth-service
            go_version: "1.23"
            serv_port: 8001

          - service: flag
            language: python
            dockerfile: build/Dockerfile-flag
            code_dir: build/flag-service
            docker_context: build
            ecr_repo: flag-service
            python_version: "3.12"
            serv_port: 8002

          - service: targeting
            language: python
            dockerfile: build/Dockerfile-targeting
            code_dir: build/targeting-service
            docker_context: build
            ecr_repo: targeting-service
            python_version: "3.12"
            serv_port: 8003

          - service: evaluation
            language: go
            dockerfile: build/Dockerfile-evaluation
            code_dir: build/evaluation-service
            docker_context: build
            ecr_repo: evaluation-service
            go_version: "1.23"
            serv_port: 8004

          - service: analytics
            language: python
            dockerfile: build/Dockerfile-analytics
            code_dir: build/analytics-service
            docker_context: build
            ecr_repo: analytics-service
            python_version: "3.12"
            serv_port: 8005

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v6

      # Setup do Go e do Python
      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go_version }}

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      # 2. Build e Unit Test
      - name: Build e Unit Test (Go)
        if: matrix.language == 'go'
        working-directory: ${{ matrix.code_dir }}
        run: |
          export PORT="${{ matrix.serv_port }}"
          export MASTER_KEY="admin123"
          export DATABASE_URL="postgres://SEU_USUARIO:SUA_SENHA@localhost:5432/auth_db"
          export REDIS_URL="redis://localhost:6379"
          export FLAG_SERVICE_URL="http://localhost:8002"
          export TARGETING_SERVICE_URL="http://localhost:8003"
          export AWS_SQS_URL="https://sqs.us-east-1.amazonaws.com/123456789012/sua-fila"
          export AWS_REGION="${{ secrets.AWS_REGION }}"
          go mod tidy
          go run .
          curl -fs "http://localhost:${{ matrix.serv_port }}/health" && echo "Health OK" || echo "Health FAIL"

      - name: Build e Unit Test (Python)
        if: matrix.language == 'python'
        working-directory: ${{ matrix.code_dir }}
        run: |
          export PORT="${{ matrix.serv_port }}"
          export DATABASE_URL="postgres://SEU_USUARIO:SUA_SENHA@localhost:5432/flags_db"
          export AUTH_SERVICE_URL="http://localhost:${{ matrix.serv_port }}"
          export AWS_SQS_URL="https://sqs.us-east-1.amazonaws.com/123456789012/sua-fila"
          export AWS_DYNAMODB_TABLE="ToggleMasterAnalytics"
          export AWS_REGION="${{ secrets.AWS_REGION }}"
          pip install -r requirements.txt
          gunicorn --bind 0.0.0.0:${{ matrix.serv_port }} app:app
          curl -fs "http://localhost:${{ matrix.serv_port }}/health" && echo "Health OK" || echo "Health FAIL"

