name: CI/CD Microsserviços

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REGISTRY: ${{ secrets.AWS_ACC_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

permissions:
  id-token: write
  contents: read

jobs:
  # ========================================
  # JOB 1: Detectar mudanças em cada serviço
  # ========================================
  detect-changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      analytics: ${{ steps.changes.outputs.analytics }}
      auth: ${{ steps.changes.outputs.auth }}
      evaluation: ${{ steps.changes.outputs.evaluation }}
      flag: ${{ steps.changes.outputs.flag }}
      targeting: ${{ steps.changes.outputs.targeting }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detectar os arquivos alterados
        id: changes
        run: |
          # Para PR, comparar com main; para push, comparar com o commit anterior
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.base_ref }}"
            HEAD_REF="${{ github.head_ref }}"
            git fetch origin $BASE_REF
            CHANGED_FILES=$(git diff --name-only origin/$BASE_REF..HEAD)
          else
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
          fi
          
          echo "Arquivos alterados:"
          echo "$CHANGED_FILES"
          
          # Verificar cada serviço
          [[ "$CHANGED_FILES" == *"build/analytics-service/"* ]] && echo "analytics=true" >> $GITHUB_OUTPUT || echo "analytics=false" >> $GITHUB_OUTPUT
          [[ "$CHANGED_FILES" == *"build/auth-service/"* ]] && echo "auth=true" >> $GITHUB_OUTPUT || echo "auth=false" >> $GITHUB_OUTPUT
          [[ "$CHANGED_FILES" == *"build/evaluation-service/"* ]] && echo "evaluation=true" >> $GITHUB_OUTPUT || echo "evaluation=false" >> $GITHUB_OUTPUT
          [[ "$CHANGED_FILES" == *"build/flag-service/"* ]] && echo "flag=true" >> $GITHUB_OUTPUT || echo "flag=false" >> $GITHUB_OUTPUT
          [[ "$CHANGED_FILES" == *"build/targeting-service/"* ]] && echo "targeting=true" >> $GITHUB_OUTPUT || echo "targeting=false" >> $GITHUB_OUTPUT

  # ========================================
  # JOB 2: Configurar a autenticação AWS
  # ========================================
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACC_ID }}:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Login no ECR
        run: |
          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

